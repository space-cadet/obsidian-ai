name: Build and Release Obsidian Plugin

on:
    push:
        tags:
            - "*" # Triggers on any tag

env:
    PLUGIN_NAME: chat-lab

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            # 1. Checkout the repository
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Set Up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            # 2. Set up Node.js environment with caching
            - name: Set Up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "lts/*" # Use the latest LTS version
                  cache: "pnpm"

            # 3. Install dependencies and build the project
            - name: Install and Build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            # 4. Verify build output
            - name: Verify Build Output
              run: |
                  test -f main.js || (echo "Build failed: main.js not found" && exit 1)

            # 5. Prepare release assets
            - name: Prepare Release Assets
              run: |
                  mkdir -p $PLUGIN_NAME
                  cp main.js manifest.json styles.css $PLUGIN_NAME
                  zip -r ${PLUGIN_NAME}.zip $PLUGIN_NAME

            # 6. Retrieve the tag name
            - name: Get Tag Name
              id: get_tag
              run: echo "tag_name=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

            # 7. Create a new release and upload all assets in one step
            - name: Create Release and Upload Assets
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ steps.get_tag.outputs.tag_name }}
                  name: ${{ steps.get_tag.outputs.tag_name }}
                  allowUpdates: true
                  removeArtifacts: true
                  artifacts: |
                      ${{ env.PLUGIN_NAME }}.zip
                      main.js
                      manifest.json
                      styles.css
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
