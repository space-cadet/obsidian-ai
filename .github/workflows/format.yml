name: Format Check

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    prettier:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prettier check changed files
              env:
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "$BASE_SHA" =~ ^0+$ ]]; then
                      BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
                  fi

                  mapfile -t files < <(
                      git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" \
                          | grep -E '\.(css|html|js|jsx|json|md|ts|tsx|yaml|yml)$' \
                          | grep -vE '(^|/)(main\.js|src/version-info\.ts)$' \
                          || true
                  )

                  if ((${#files[@]} == 0)); then
                      echo "No Prettier-supported changed files to check."
                      exit 0
                  fi

                  printf 'Checking %d changed files:\n' "${#files[@]}"
                  printf ' - %s\n' "${files[@]}"
                  pnpm exec prettier --check "${files[@]}"
